namespace:
  name: library-app
  create: true

images:
  frontend:
    repository: sotirusama/library-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  backend:
    repository: sotirusama/library-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  mongodb:
    repository: sotirusama/library-mongodb
    tag: "1.0.0"
    pullPolicy: IfNotPresent

frontend:
  replicaCount: 1
  containerPort: 8080
  service:
    type: NodePort
    port: 8080
    nodePort: 30080

backend:
  replicaCount: 1
  containerPort: 5000
  service:
    port: 5000

mongodb:
  replicaCount: 1
  containerPort: 27017
  service:
    port: 27017

config:
  mongoURI: mongodb://mongodb:27017/library
  frontendOrigin: "*"
  appEnv: production

secret:
  jwtSecret: "REPLACE_WITH_A_RANDOM_SECRET"

storage:
  enabled: true
  size: 500Mi
  storageClassName: ""
  hostPath: /mnt/mongo-data
  hostPathType: DirectoryOrCreate
  reclaimPolicy: Retain
  nodeHostname: ""