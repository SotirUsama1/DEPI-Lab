---
- name: Prepare Kubernetes nodes
  hosts: masters:workers
  become: true
  gather_facts: true
  vars:
    kubernetes_minor_version: "v1.35"
    kubernetes_package_version: "1.35.*"
    pod_network_cidr: "10.1.0.0/16"
    containerd_socket: "unix:///run/containerd/containerd.sock"
  tasks:
    - name: Require Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == "Ubuntu"
        fail_msg: "This playbook currently supports Ubuntu hosts only."

    - name: Require at least 2 GiB of memory
      ansible.builtin.assert:
        that:
          - ansible_facts['memtotal_mb'] >= 1905
        fail_msg: >-
          {{ inventory_hostname }} has {{ ansible_facts['memtotal_mb'] }} MiB RAM.
          Kubernetes requires at least 2 GiB per machine; resize this EC2
          instance before running the playbook.

    - name: Disable swap for the current boot
      ansible.builtin.command: swapoff -a
      changed_when: false

    - name: Disable swap in fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        line: '# \1'
        backrefs: true

    - name: Load required kernel modules now
      ansible.builtin.command:
        argv:
          - modprobe
          - "{{ item }}"
      changed_when: false
      loop:
        - overlay
        - br_netfilter

    - name: Persist required kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        owner: root
        group: root
        mode: "0644"

    - name: Configure Kubernetes networking sysctls
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes-cri.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
        owner: root
        group: root
        mode: "0644"

    - name: Apply Kubernetes networking sysctls immediately
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Install containerd and repository prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - containerd
          - curl
          - gpg
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create apt keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Kubernetes repository signing key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        owner: root
        group: root
        mode: "0644"
      register: kubernetes_repo_key

    - name: Check for the dearmored Kubernetes signing key
      ansible.builtin.stat:
        path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      register: kubernetes_repo_keyring

    - name: Dearmor Kubernetes repository signing key
      ansible.builtin.command:
        cmd: >-
          gpg --dearmor --yes
          --output /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          /etc/apt/keyrings/kubernetes-apt-keyring.asc
      changed_when: true
      when: kubernetes_repo_key.changed or not kubernetes_repo_keyring.stat.exists

    - name: Configure Kubernetes apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: >-
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg]
          https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/ /
        owner: root
        group: root
        mode: "0644"

    - name: Install Kubernetes 1.35 packages
      ansible.builtin.apt:
        name:
          - "kubelet={{ kubernetes_package_version }}"
          - "kubeadm={{ kubernetes_package_version }}"
          - "kubectl={{ kubernetes_package_version }}"
        state: present
        update_cache: true
        allow_downgrade: true

    - name: Hold Kubernetes packages at the selected minor version
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Create containerd configuration directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Generate default containerd configuration
      ansible.builtin.command:
        argv:
          - containerd
          - config
          - default
      register: containerd_default_config
      changed_when: false

    - name: Install default containerd configuration if absent
      ansible.builtin.copy:
        content: "{{ containerd_default_config.stdout }}\n"
        dest: /etc/containerd/config.toml
        owner: root
        group: root
        mode: "0644"
        force: false

    - name: Use systemd cgroups in containerd
      ansible.builtin.lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^\s*SystemdCgroup\s*='
        line: "            SystemdCgroup = true"
      notify: Restart containerd

    - name: Enable and start containerd
      ansible.builtin.systemd:
        name: containerd
        enabled: true
        state: started

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
        state: started

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted

- name: Initialize the Kubernetes control plane
  hosts: masters
  become: true
  gather_facts: true
  vars:
    pod_network_cidr: "10.1.0.0/16"
    containerd_socket: "unix:///run/containerd/containerd.sock"
    flannel_manifest_url: "https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml"
  tasks:
    - name: Check whether the control plane is already initialized
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: control_plane_config

    - name: Initialize the control plane
      ansible.builtin.command:
        argv:
          - kubeadm
          - init
          - "--apiserver-advertise-address={{ ansible_facts['default_ipv4']['address'] }}"
          - "--pod-network-cidr={{ pod_network_cidr }}"
          - "--cri-socket={{ containerd_socket }}"
      when: not control_plane_config.stat.exists

    - name: Create kubeconfig directory for the ubuntu user
      ansible.builtin.file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: "0700"

    - name: Install kubeconfig for the ubuntu user
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/ubuntu/.kube/config
        remote_src: true
        owner: ubuntu
        group: ubuntu
        mode: "0600"

    - name: Download the Flannel manifest
      ansible.builtin.get_url:
        url: "{{ flannel_manifest_url }}"
        dest: /tmp/kube-flannel.yml
        owner: root
        group: root
        mode: "0644"

    - name: Apply Flannel CNI
      ansible.builtin.command:
        argv:
          - kubectl
          - apply
          - -f
          - /tmp/kube-flannel.yml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: flannel_apply
      changed_when: >-
        'created' in flannel_apply.stdout or
        'configured' in flannel_apply.stdout

    - name: Wait for the control-plane node to become Ready
      ansible.builtin.command:
        argv:
          - kubectl
          - wait
          - --for=condition=Ready
          - node
          - --all
          - --timeout=5m
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      changed_when: false

    - name: Create a short-lived worker join command
      ansible.builtin.command:
        argv:
          - kubeadm
          - token
          - create
          - --ttl
          - 30m
          - --print-join-command
      register: worker_join_command
      changed_when: false
      no_log: true

- name: Join worker nodes to the cluster
  hosts: workers
  become: true
  gather_facts: false
  vars:
    containerd_socket: "unix:///run/containerd/containerd.sock"
  tasks:
    - name: Check whether the worker has already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: worker_kubelet_config

    - name: Join the worker to the control plane
      ansible.builtin.command:
        cmd: >-
          {{ hostvars[groups['masters'][0]].worker_join_command.stdout }}
          --cri-socket={{ containerd_socket }}
      when: not worker_kubelet_config.stat.exists
      no_log: true
