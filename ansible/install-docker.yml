---
- name: Install Docker and prepare deployment directory on Ubuntu
  hosts: all
  become: true
  vars_files:
    - vars.yml

  pre_tasks:
    - name: Verify the target is Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_distribution == "Ubuntu"
        fail_msg: This playbook supports Ubuntu hosts only.

  tasks:
    - name: Install packages required for the Docker repository
      ansible.builtin.apt:
        name: "{{ docker_prerequisite_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure the APT keyring directory exists
      ansible.builtin.file:
        path: "{{ docker_apt_keyring_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download Docker's official APT signing key
      ansible.builtin.get_url:
        url: "{{ docker_apt_key_url }}"
        dest: "{{ docker_apt_key_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Configure the official Docker APT repository
      ansible.builtin.deb822_repository:
        name: docker
        types:
          - deb
        uris:
          - "{{ docker_apt_repository_url }}"
        suites:
          - "{{ ansible_distribution_release }}"
        components:
          - "{{ docker_apt_repository_component }}"
        architectures:
          - "{{ docker_apt_arch }}"
        signed_by: "{{ docker_apt_key_path }}"
        state: present
      register: docker_repository

    - name: Update APT cache when the Docker repository changes
      ansible.builtin.apt:
        update_cache: true
      when: docker_repository.changed

    - name: Install Docker Engine and the Compose plugin
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
      notify: Restart Docker

    - name: Ensure Docker is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create the application deployment directory
      ansible.builtin.file:
        path: "{{ deployment_directory }}"
        state: directory
        owner: "{{ deployment_owner }}"
        group: "{{ deployment_group }}"
        mode: "{{ deployment_directory_mode }}"

  handlers:
    - name: Restart Docker
      ansible.builtin.service:
        name: docker
        state: restarted
