name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r app/requirements-dev.txt

      - name: Run pytest
        run: python -m pytest

  sonarqube:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: test
    if: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [test, sonarqube]
    if: always() && needs.test.result == 'success' && (needs.sonarqube.result == 'success' || needs.sonarqube.result == 'skipped')

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag depi-lab:ci --file app/Dockerfile app

      - name: Save Docker image
        run: docker save depi-lab:ci --output image.tar

      - name: Upload image for scanning
        uses: actions/upload-artifact@v4
        with:
          name: depi-lab-image-for-scan
          path: image.tar
          if-no-files-found: error
          retention-days: 1

  trivy:
    name: Scan container image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: depi-lab-image-for-scan

      - name: Load Docker image
        run: docker load --input image.tar

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: depi-lab:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  publish-image:
    name: Upload scanned image
    runs-on: ubuntu-latest
    needs: trivy

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: depi-lab-image-for-scan

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: depi-lab-image
          path: image.tar
          if-no-files-found: error
          retention-days: 1

  checkov:
    name: Scan infrastructure with Checkov
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Scan Terraform with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          soft_fail: true
