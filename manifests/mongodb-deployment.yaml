apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: library-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: sotirusama/library-mongodb:1.0.0
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          ports:
            - name: mongodb
              containerPort: 27017
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: mongo-data
          persistentVolumeClaim:
            claimName: mongo-data
