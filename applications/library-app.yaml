apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: library-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SotirUsama1/DEPI-Lab.git
    targetRevision: argocd
    path: library-gitops/charts/library-app
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: library-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true